# Optional vanpi LAN override: install only alongside the local 10-lan.conf.
# Keep this exact address in sync with that file's --bind argument.
[Service]
# NetworkManager startup completion does not guarantee this DHCP address.
ExecStartPre=/bin/sh -ec 'until /usr/sbin/ip -4 -o address show dev eth0 | /usr/bin/grep -Fq " inet 192.168.6.103/"; do /usr/bin/sleep 1; done'
TimeoutStartSec=90
# ip reads interface addresses through netlink; AF_CAN remains excluded.
RestrictAddressFamilies=AF_NETLINK
