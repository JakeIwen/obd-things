# The shared CLI lock: a warning-chat Codex and a research CLI never run at the same time.
# van-telemetry-advisor.service and van-telemetry-research.service both take an exclusive flock on
# the file (read-only access is enough). Installed as /etc/tmpfiles.d/van-assistant.conf.
d /run/van-assistant 0750 pi pi -
f /run/van-assistant/model-cli.lock 0640 pi pi -
